events { worker_connections 1024; }
http {
    upstream openproject { server openproject-app:8080; }
    upstream hocuspocus  { server openproject-hocuspocus:1234; }
    upstream nextcloud   { server nextcloud-app:80; }

    upstream axerp { server axerp-frontend:8080; }

    # ── HTTP → HTTPS redirect (all domains) ────────────────────────────────────
    server {
        listen 80;
        server_name projects.axinagroup.com files.axinagroup.com erp.axinagroup.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── OpenProject — projects.axinagroup.com ───────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name projects.axinagroup.com;
        ssl_certificate /etc/letsencrypt/live/projects.axinagroup.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/projects.axinagroup.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        client_max_body_size 150M;
        location /hocuspocus {
            proxy_pass http://hocuspocus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
        location /mcp/ {
            proxy_pass http://openproject-mcp-server:39128/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host openproject-mcp-server:39128;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
        location /messages/ {
            proxy_pass http://openproject-mcp-server:39128/messages/;
            proxy_http_version 1.1;
            proxy_set_header Host openproject-mcp-server:39128;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://openproject;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }
    }

    # ── Nextcloud — files.axinagroup.com ───────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name files.axinagroup.com;
        ssl_certificate /etc/letsencrypt/live/files.axinagroup.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/files.axinagroup.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Large file uploads (Nextcloud supports up to 5 GB chunks)
        client_max_body_size 5G;
        proxy_read_timeout 3600;
        proxy_buffering off;
        proxy_request_buffering off;

        # CalDAV / CardDAV discovery redirects (required by Nextcloud)
        location = /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location = /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location / {
            proxy_pass http://nextcloud;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # ── AXERP (ERPNext) — erp.axinagroup.com ───────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name erp.axinagroup.com;
        ssl_certificate /etc/letsencrypt/live/erp.axinagroup.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/erp.axinagroup.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        client_max_body_size 100m;
        proxy_read_timeout 300;

        location /socket.io/ {
            proxy_pass http://axerp-websocket:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://axerp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
