# Pydio Cells — local validation stack
# Standalone: separate postgres, does NOT touch the OpenProject stack.
#
# Usage:
#   docker compose -f docker-compose.cells-local.yml up -d
#   docker compose -f docker-compose.cells-local.yml logs -f cells
#   Open installer: http://localhost:8080
#
# ClamAV note: first startup downloads ~300 MB of virus definitions — allow 5-10 min
# before cells is fully healthy. Watch with: docker logs cells-local-clamav -f

services:

  postgres:
    image: postgres:16
    container_name: cells-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cells
      POSTGRES_PASSWORD: ${CELLS_DB_PASSWORD:-cells_local_dev}
      POSTGRES_DB: cells
    volumes:
      - cells-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cells"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: cells-local-clamav
    restart: unless-stopped
    # clamd listens on TCP port 3310 — accessible as clamav:3310 within this network.
    # No host port mapping needed; cells reaches it via the shared bridge network.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s    # definitions download window

  cells:
    image: pydio/cells:latest
    container_name: cells-local-app
    restart: unless-stopped
    ports:
      - "8080:8080"         # installer + app on localhost:8080
    environment:
      CELLS_SITE_BIND: "0.0.0.0:8080"
      CELLS_SITE_EXTERNAL: "http://localhost:8080"
      # After install, Cells writes its full config to the volume below.
      # Do not set CELLS_DATABASE_DSN here — provide it through the web installer
      # so the full schema migration runs correctly on first boot.
    volumes:
      - cells-config:/root/.config/pydio/cells
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

networks:
  default:
    name: cells-local

volumes:
  cells-pgdata:
  cells-config:
