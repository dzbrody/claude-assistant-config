# AXERP (ERPNext v16) — Production Compose
# Domain:   erp.axinagroup.com
# Database: axerp-mariadb (MariaDB 10.6) — dedicated container, arm64
#           ERPNext requires MariaDB; PostgreSQL has thousands of incompatible
#           raw SQL queries (sum(unknown), DATE_SUB, etc.) across the codebase.
# Port:     127.0.0.1:8082:8080 (proxied by openproject-nginx)
# Platform: linux/arm64 (Graviton2 EC2)
#
# Database layout on this host:
#   openproject-postgres  → OpenProject + Nextcloud  (PostgreSQL 16)
#   axerp-mariadb         → ERPNext only              (MariaDB 10.6)
#
# Image tag convention: axerp:<ERPNEXT_VERSION>-axerp.<PATCH>
# To upgrade upstream: bump tag, pull + rebuild on EC2, redeploy.
#
# Asset architecture:
#   axerp-assets (named volume) — populated from image on first run,
#   shared between backend and frontend so bench build output is immediately
#   visible to nginx without any docker cp steps.
#
# Deploy (EC2 via SSM):
#   aws s3 cp docker-compose.axerp.yml s3://axina-openproject-files/deploy/
#   # On EC2:
#   cd /opt/openproject && docker compose -f docker-compose.axerp.yml up -d
#
# Monitor first-run site creation:
#   docker logs axerp-create-site -f    # exits 0 on success (~5–10 min)

x-axerp-image: &axerp_image
  image: axerp:v16.23.0-axerp.3
  platform: linux/arm64
  restart: unless-stopped
  networks:
    - openproject_default
  volumes:
    - /data/axerp/sites:/home/frappe/frappe-bench/sites
    - axerp-assets:/home/frappe/frappe-bench/sites/assets
    - /data/axerp/logs:/home/frappe/frappe-bench/logs
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── MariaDB — dedicated to ERPNext ───────────────────────────────────────
  axerp-mariadb:
    image: mariadb:10.6
    platform: linux/arm64
    container_name: axerp-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AXERP_DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - /data/axerp/mariadb:/var/lib/mysql
    networks:
      - openproject_default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --bind-address=0.0.0.0

  # ── Frappe services ───────────────────────────────────────────────────────
  backend:
    <<: *axerp_image
    container_name: axerp-backend
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    <<: *axerp_image
    container_name: axerp-configurator
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: axerp-mariadb
      DB_PORT: "3306"
      REDIS_CACHE: axerp-redis-cache:6379
      REDIS_QUEUE: axerp-redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      axerp-mariadb:
        condition: service_healthy
      axerp-redis-cache:
        condition: service_started
      axerp-redis-queue:
        condition: service_started

  create-site:
    <<: *axerp_image
    container_name: axerp-create-site
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 axerp-mariadb:3306;
        wait-for-it -t 120 axerp-redis-cache:6379;
        wait-for-it -t 120 axerp-redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "ERROR: sites/common_site_config.json not ready after 120s";
            exit 1;
          fi;
        done;
        if [ -f "sites/$$SITE_NAME/site_config.json" ]; then
          echo "Site $$SITE_NAME already exists — skipping creation.";
          exit 0;
        fi;
        echo "Creating site $$SITE_NAME on MariaDB...";
        bench new-site \
          --mariadb-root-password $$DB_ROOT_PASSWORD \
          --mariadb-user-host-login-scope='%' \
          --admin-password $$SITE_ADMIN_PASSWORD \
          --install-app erpnext \
          --set-default $$SITE_NAME;
        echo "Installing hrms...";
        bench --site $$SITE_NAME install-app hrms;
        echo "Installing crm...";
        bench --site $$SITE_NAME install-app crm;
        echo "Installing insights...";
        bench --site $$SITE_NAME install-app insights;
        echo "Site creation complete.";
    environment:
      SITE_NAME: ${AXERP_SITE_NAME:-erp.axinagroup.com}
      DB_ROOT_PASSWORD: ${AXERP_DB_ROOT_PASSWORD}
      SITE_ADMIN_PASSWORD: ${AXERP_ADMIN_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully
      axerp-mariadb:
        condition: service_healthy

  frontend:
    <<: *axerp_image
    container_name: axerp-frontend
    restart: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: axerp-backend:8000
      FRAPPE_SITE_NAME_HEADER: ${AXERP_SITE_NAME:-erp.axinagroup.com}
      SOCKETIO: axerp-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 100m
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

  websocket:
    <<: *axerp_image
    container_name: axerp-websocket
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://axerp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://axerp-redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *axerp_image
    container_name: axerp-queue-long
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      FRAPPE_REDIS_CACHE: redis://axerp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://axerp-redis-queue:6379
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *axerp_image
    container_name: axerp-queue-short
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      FRAPPE_REDIS_CACHE: redis://axerp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://axerp-redis-queue:6379
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *axerp_image
    container_name: axerp-scheduler
    command:
      - bench
      - schedule
    depends_on:
      configurator:
        condition: service_completed_successfully

  axerp-redis-cache:
    image: redis:6.2-alpine
    platform: linux/arm64
    container_name: axerp-redis-cache
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - openproject_default

  axerp-redis-queue:
    image: redis:6.2-alpine
    platform: linux/arm64
    container_name: axerp-redis-queue
    restart: unless-stopped
    volumes:
      - /data/axerp/redis-queue:/data
    networks:
      - openproject_default

networks:
  openproject_default:
    external: true

# Named volumes for data that must outlive containers
volumes:
  # axerp-assets: populated from the image's baked sites/assets/ on first run.
  # Shared between backend (bench build writes here) and frontend (nginx serves from here).
  # Eliminates the need for docker cp after bench build.
  # To repopulate after image upgrade: docker volume rm axerp_axerp-assets
  axerp-assets:
