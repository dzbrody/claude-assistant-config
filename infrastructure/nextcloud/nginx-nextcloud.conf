# Nextcloud nginx server blocks — append to openproject nginx.conf
# Domain: files.ctorescues.com → nextcloud-app:80 (port 8091 on host, internal 80)

upstream nextcloud { server nextcloud-app:80; }

server {
    listen 80;
    server_name files.ctorescues.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.ctorescues.com;
    ssl_certificate     /etc/letsencrypt/live/files.ctorescues.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.ctorescues.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Nextcloud recommends 5GB for large file uploads
    client_max_body_size 5G;
    proxy_read_timeout 3600;
    proxy_buffering off;
    proxy_request_buffering off;

    # Well-known redirects (CalDAV/CardDAV discovery)
    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://nextcloud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required by Nextcloud's CSRF protection
        proxy_set_header X-Forwarded-Host $host;
    }
}
