                      - heading "Auth Design" [level=2] [ref=e434]
                      - paragraph [ref=e435]:
                        - text: The remote MCP server authenticates via a 64-character hex API key passed as a query parameter (
                        - code [ref=e436]: "?key=..."
                        - text: ) or
                        - code [ref=e437]: X-MCP-Key
                        - text: header on the initial SSE connection. After the SSE connection is established, the session ID acts as a bearer token for subsequent
                        - code [ref=e438]: /mcp/messages/
                        - text: calls — which is why the messages endpoint doesn't require the key again (it's already authenticated via the session).
                      - paragraph [ref=e439]:
                        - text: This design exists because Claude Desktop and
                        - code [ref=e440]: mcp-proxy
                        - text: don't forward custom headers on SSE connections — so the key must be in the URL.
