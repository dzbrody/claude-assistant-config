              - heading "Architecture Overview" [level=2] [ref=e128]:  Architecture Overview
              - paragraph [ref=e129]: "Claude Assistant connects a native macOS app to a suite of local and remote MCP servers, all orchestrated by the Claude CLI:"
              - list [ref=e130]:
                - listitem [ref=e131]:
                  - paragraph [ref=e132]:
                    - strong [ref=e133]: "Local MCP servers (stdio):"
                    - text: google-workspace · whatsapp · filesystem · document-loader · aws-s3-local · playwright
                - listitem [ref=e134]:
                  - paragraph [ref=e135]:
                    - strong [ref=e136]: "Remote MCP server (SSE):"
                    - code [ref=e137]: https://projects.axinagroup.com/mcp/sse
                    - text: — OpenProject + S3 tools, works from any device (Mac, mobile, IDE)
                - listitem [ref=e138]:
                  - paragraph [ref=e139]:
                    - strong [ref=e140]: "Background services (launchd):"
                    - text: whatsapp-bridge (Go, always-on) · openproject-notifier (Python, every 15 min) · claude-assistant app (menu bar)
                - listitem [ref=e141]:
                  - paragraph [ref=e142]:
                    - strong [ref=e143]: "EC2 on AWS:"
                    - text: OpenProject + remote MCP server in Docker behind nginx with SSL
              - heading "How This Project Is Managed" [level=2] [ref=e144]:  How This Project Is Managed
              - paragraph [ref=e145]: This project is itself a showcase of the system it documents. All work packages, bugs, and features are tracked here in OpenProject. Claude creates and updates work packages directly via the remote MCP server — no manual data entry needed. This is a practical demonstration of AI-assisted project management.
              - paragraph [ref=e146]:
                - strong [ref=e147]: "Work packages are organized as:"
                - text: Features (capabilities) · Bugs (fixes) · Milestones (infrastructure) · Tasks (setup/ops)