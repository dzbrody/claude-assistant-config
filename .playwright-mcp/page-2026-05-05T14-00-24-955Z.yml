              - heading "Claude Personal Assistant — AXINA Group Infrastructure" [level=1] [ref=e78]:  Claude Personal Assistant — AXINA Group Infrastructure
              - paragraph [ref=e79]: A complete AI-powered personal assistant ecosystem built with Claude Code and Claude CLI. Runs morning briefings, evening wrap-ups, weekly reviews, and real-time OpenProject notifications — all from a native Mac menu bar app with one click.
              - paragraph [ref=e80]:
                - strong [ref=e81]: "GitHub:"
                - link "https://github.com/dzbrody/claude-assistant-config" [ref=e82] [cursor=pointer]:
                  - /url: https://github.com/dzbrody/claude-assistant-config
                - strong [ref=e83]: "Infrastructure:"
                - text: AWS us-east-1 |
                - strong [ref=e84]: "Status:"
                - text: Active |
                - strong [ref=e85]: "Author:"
                - text: Daniel Brody (
                - link "db@axinagroup.com" [ref=e86] [cursor=pointer]:
                  - /url: mailto:db@axinagroup.com
                - text: )
              - heading "What This Does" [level=2] [ref=e87]:  What This Does
              - paragraph [ref=e88]:
                - strong [ref=e89]: Click ☀️ in the menu bar
                - text: "→ Terminal opens, claude launches, the full morning briefing runs automatically:"
              - list [ref=e90]:
                - listitem [ref=e91]:
                  - paragraph [ref=e92]: Scans overnight TSPG WhatsApp messages — downloads and saves documents to Google Drive with original filenames, creates OpenProject work packages for action items
                - listitem [ref=e93]:
                  - paragraph [ref=e94]: Scans unread Gmail, flags urgent items from AXINA/XGC/4ward domains
                - listitem [ref=e95]:
                  - paragraph [ref=e96]: Extracts tasks from Gemini meeting notes → OpenProject
                - listitem [ref=e97]:
                  - paragraph [ref=e98]: Reviews today's calendar, flags conflicts
                - listitem [ref=e99]:
                  - paragraph [ref=e100]:
                    - text: Writes
                    - code [ref=e101]: ~/Documents/daily_briefs/YYYY-MM-DD.md
                - listitem [ref=e102]:
                  - paragraph [ref=e103]: Sends a WhatsApp summary to your number
              - paragraph [ref=e104]:
                - strong [ref=e105]: Click 🌙
                - text: "→ Evening wrap-up: sent emails, Drive activity, TSPG afternoon messages, task status, tomorrow preview."
                - strong [ref=e106]: Click 📅 / 📊
                - text: → Weekend briefing and weekly review on Sundays.
                - strong [ref=e107]: Always running in background
                - text: → OpenProject notifier posts every new task, status change, and assignment to WhatsApp every 15 minutes.
              - heading "Wiki Pages" [level=2] [ref=e108]:  Wiki Pages
              - list [ref=e109]:
                - listitem [ref=e110]:
                  - paragraph [ref=e111]:
                    - strong [ref=e112]: Installation — Mac
                    - text: — Full setup guide for macOS (the primary platform)
                - listitem [ref=e113]:
                  - paragraph [ref=e114]:
                    - strong [ref=e115]: Installation — Windows
                    - text: — Setup guide for Windows users using WSL2
                - listitem [ref=e116]:
