                    - strong [ref=e118]: MCP Server Ecosystem
                    - text: — All MCP servers, architecture, and how to add/remove them
                - listitem [ref=e119]:
                  - paragraph [ref=e120]:
                    - strong [ref=e121]: Scheduled Briefings
                    - text: — Morning, evening, weekend, and weekly review prompts
                - listitem [ref=e122]:
                  - paragraph [ref=e123]:
                    - strong [ref=e124]: Infrastructure
                    - text: — EC2, Docker, Terraform, S3, and deployment
                - listitem [ref=e125]:
