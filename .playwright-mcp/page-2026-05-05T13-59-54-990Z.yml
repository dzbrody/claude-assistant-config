                      - paragraph [ref=e451]:
                        - strong [ref=e452]: "Q: Can multiple people use this setup?"
                        - text: "A: Yes — each person clones the repo, gets their own OpenProject account (ask Daniel), and gets the MCP API key from 1Password. Edit"
                        - code [ref=e453]: install-all.sh
                        - text: to use your own filesystem paths before running it.
                      - paragraph [ref=e454]:
                        - strong [ref=e455]: "Q: How do I add a new MCP server?"
                        - text: "A: See the MCP Server Ecosystem wiki page. The short version:"
                        - code [ref=e456]: claude mcp add --transport stdio --scope user <name> -- npx -y <package>
                        - text: . Add it to
                        - code [ref=e457]: install-all.sh
                        - text: so others can replicate it.
                      - paragraph [ref=e458]:
                        - strong [ref=e459]: "Q: How do I update Claude CLI?"
